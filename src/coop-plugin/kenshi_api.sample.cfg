# kenshi_api.cfg - Kenshi API rules (sample).
# Copy to kenshi_api.cfg beside SharedWastelands.dll (mods\Shared Wastelands\). Read once at game start.
# The rules are local data: every co-op game reads its own copy, so keep the copies the same on every machine.
#
#   race <race> block_slot <slot>[|<slot>...]     slots: weapon armour pants shirt boots helmet backpack belt
#   race <race> no_weapon_in_hand
#   race <race> skill_xp <skill> <percent>        +40 = 1.4x XP, -99 = 0.01x, -100 = none
#   race <race> stat_cap <skill> <max>
#   race <race> anim_speed <multiplier>
# <race> = a string ID (7100001-OCS-100.mod) or a race name ("double quoted" when it has spaces).
# A line that does not parse is skipped and counted in the log ([KAPI]).
#
# ENFORCED NOW: block_slot (every way an item goes onto a character: drag, loot, buy, auto-equip - a refused item goes to the
# bag), no_weapon_in_hand (for now by keeping weapons out of the hip and back slots, so there is nothing to draw) and skill_xp
# (skill training, jobs and first aid; a boosted gain stops at the game's own 20 per gain).
# NOT YET: stat_cap and anim_speed are parsed and logged only. See the [KAPI] lines in shared_wastelands_log.txt.
# Every co-op player needs the SAME kenshi_api.cfg: the rules are checked on each game.

# ---- OCS-100 (example: a robot race) -------------------------------------------------------------------------------
# A robot: never holds a weapon, wears no armour or clothes. The belt and the backpack (the OCS Cargo Frame) stay allowed.
race 7100001-OCS-100.mod block_slot weapon|armour|pants|shirt|boots|helmet
race 7100001-OCS-100.mod no_weapon_in_hand
# Skill XP beyond the race +-20% cap (example figures).
race 7100001-OCS-100.mod skill_xp heavy_weapons +40
race 7100001-OCS-100.mod skill_xp stealth -99

# ---- OCS-100 Battle-Worn (same chassis, armour chunks missing) ----------------------------------------------------
race 7100002-OCS-100.mod block_slot weapon|armour|pants|shirt|boots|helmet
race 7100002-OCS-100.mod no_weapon_in_hand
race 7100002-OCS-100.mod skill_xp heavy_weapons +40
race 7100002-OCS-100.mod skill_xp stealth -99

# Examples of the other verbs, off:
# race 7100001-OCS-100.mod stat_cap athletics 60
# race 7100001-OCS-100.mod anim_speed 0.8
# race "OCS-100 Battle-Worn" anim_speed 0.9
