# kenshi_api.cfg - per-race rules (sample).
# Copy to kenshi_api.cfg beside SharedWastelands.dll (mods\Shared Wastelands\). Read once when the game starts.
#
#   race <race> block_slot <slot>[|<slot>...]     slots: weapon armour pants shirt boots helmet backpack belt
#   race <race> no_weapon_in_hand
#   race <race> skill_xp <skill> <percent>        +40 = 1.4x XP, -99 = 0.01x, -100 = none
#   race <race> stat_cap <skill> <max>            read and logged only, not applied yet
#   race <race> anim_speed <multiplier>           read and logged only, not applied yet
# <race> = the race's string ID (7100001-OCS-100.mod), "double quoted" when it holds spaces. The race's shown name is
# never used. A line that does not parse is skipped and counted in the log ([KAPI] lines).
#
# APPLIED: block_slot (every way an item goes onto a character: drag, loot, buy, trade, give, auto-equip, loading a save -
# a refused item goes to the bag), no_weapon_in_hand (by keeping weapons out of the hip and back slots, so there is nothing
# to draw) and skill_xp (skill training, jobs and first aid; a boosted gain stops at the game's own 20 per gain).
#
# MULTIPLAYER: the host's file is the world's rules. The host's game sends them to the world server when it connects, and
# every player's game applies the world's copy; a joining player's own kenshi_api.cfg is not used. In solo play the
# game uses its own file. At most 32 races.

# ---- OCS-100 (example: a robot race) -------------------------------------------------------------------------------
# A robot: never holds a weapon, wears no armour or clothes. The belt and the backpack (the OCS Cargo Frame) stay allowed.
race 7100001-OCS-100.mod block_slot weapon|armour|pants|shirt|boots|helmet
race 7100001-OCS-100.mod no_weapon_in_hand
# Skill XP beyond the race +-20% cap (example figures).
race 7100001-OCS-100.mod skill_xp heavy_weapons +40
race 7100001-OCS-100.mod skill_xp stealth -99

# ---- OCS-100 Battle-Worn (same chassis, armour chunks missing) ----------------------------------------------------
race 7100002-OCS-100.mod block_slot weapon|armour|pants|shirt|boots|helmet
race 7100002-OCS-100.mod no_weapon_in_hand
race 7100002-OCS-100.mod skill_xp heavy_weapons +40
race 7100002-OCS-100.mod skill_xp stealth -99

# Examples of the other verbs, off:
# race 7100001-OCS-100.mod stat_cap athletics 60
# race 7100001-OCS-100.mod anim_speed 0.8
